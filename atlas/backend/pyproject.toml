[project]
name = "atlas-api"
version = "0.1.0"
description = "ATLAS TERMINAL backend: market data, deterministic analytics, AI research desk"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "httpx>=0.27", "pydantic>=2.6",
  "numpy>=1.26", "pandas>=2.1", "exchange_calendars>=4.5", "anthropic>=0.40", "yfinance>=0.2.40", "ib_async>=1.0",
]
[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["atlas_api*"]
[tool.setuptools.package-data]
atlas_api = ["../migrations/*.sql"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
