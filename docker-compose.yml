# ATLAS in the cloud: the app (private, no published port) behind Caddy, which adds HTTPS. Start with:  docker compose up -d --build
services:
  atlas:
    build: .
    restart: unless-stopped
    env_file: .env                          # ATLAS_AUTH_PASSWORD and optional API keys: never committed
    environment:
      ATLAS_ALLOWED_HOST: ${ATLAS_DOMAIN:?set ATLAS_DOMAIN in .env}
      ATLAS_FORWARDED_ALLOW_IPS: "*"        # safe: only the Caddy container can reach this one
      ATLAS_SCHEDULER: "off"                # the background jobs run in the worker below, not inside the web process
    volumes:
      - atlas-data:/data                    # the database (journal, notes, saved runs) lives here and survives rebuilds
    expose:
      - "8000"
  worker:
    # Runs the scheduled jobs (data refreshes, health checks, later experiments) whether or not anyone has the app open. Same image, same database volume.
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ATLAS_ALLOWED_HOST: ${ATLAS_DOMAIN:?set ATLAS_DOMAIN in .env}
    command: ["python", "-m", "atlas_api.worker"]
    volumes:
      - atlas-data:/data
    depends_on:
      - atlas
    healthcheck:
      # healthy while the scheduler has written its heartbeat in the last 3 minutes
      test: ["CMD", "python", "-c", "import sqlite3,datetime,sys; r=sqlite3.connect('/data/atlas.db').execute(\"select value from sched_settings where key='heartbeat'\").fetchone(); sys.exit(0 if r and (datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(r[0])).total_seconds()<180 else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 90s
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - atlas
    ports:
      - "80:80"
      - "443:443"
    environment:
      ATLAS_DOMAIN: ${ATLAS_DOMAIN:?set ATLAS_DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  atlas-data:
  caddy-data:
  caddy-config:
