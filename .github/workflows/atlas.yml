name: atlas
on:
  push:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
  pull_request:
    paths: ["atlas/**", ".github/workflows/atlas.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: atlas/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: pytest -q
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: atlas/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run build
      - run: npm test
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: atlas/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
